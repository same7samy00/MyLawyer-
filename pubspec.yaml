name: my_lawyer
description: "My Lawyer - Legal Platform & Services"
publish_to: 'none'
version: 1.0.0+6

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  geolocator: ^13.0.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  shared_preferences: ^2.2.3
  http: ^1.2.0
  url_launcher: ^6.3.0
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  webview_flutter: ^4.10.0
  video_player: ^2.9.5
  path_provider: ^2.1.5
  image_picker: ^1.1.2
  workmanager: 0.7.0
  flutter_local_notifications: 17.2.4
  cached_network_image: 3.4.1
  pdf: ^3.11.3
  printing: ^5.14.3
  local_auth: ^2.3.0
  flutter_secure_storage: ^10.3.4
  speech_to_text: ^7.4.0
  audioplayers: ^6.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/images/
    - assets/mahamiho/
    - assets/mahamiho/voice/
    - assets/videos/

  fonts:
    # الأرقام الإنجليزية فقط، وباقي النصوص من IBMPlexSansArabic
    - family: AppFont
      fonts:
        - asset: assets/fonts/app-digits.ttf
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Variable.ttf
