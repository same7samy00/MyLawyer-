name: my_lawyer
description: "My Lawyer - Legal Platform & Services"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  geolocator: ^13.0.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  shared_preferences: ^2.2.3
  flutter_svg: ^2.0.10+1
  http: ^1.2.0
  url_launcher: ^6.3.0
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  lottie: ^3.2.0
  webview_flutter: ^4.10.0
  video_player: ^2.9.5
  path_provider: ^2.1.5
  image_picker: ^1.1.2
  crypto: ^3.0.8
  workmanager: 0.7.0
  flutter_local_notifications: 17.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/images/
    - assets/videos/

  fonts:
    # الأرقام الإنجليزية فقط، لأن FlatJooza يرسم 0-9 بأشكال عربية
    - family: AppFont
      fonts:
        - asset: assets/fonts/app-digits.ttf
    - family: FlatJooza
      fonts:
        - asset: assets/fonts/flat-jooza-regular.ttf
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Variable.ttf
