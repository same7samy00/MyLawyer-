name: Checks

# Every push on every branch is checked on GitHub's own machines, never on our servers.
# Pinned to Ubuntu 24.04, the same as our servers, so the label move to Ubuntu 26 does not change the checks.
# No pull_request trigger: the production runner lives on our server and this repository is public.
# Paused 2026-11-07: GitHub refuses to start jobs on its machines because the account is locked
# for billing, and the owner does not want to add a payment card. The server checks still run
# before every deploy (deploy.yml), and the app checks run locally before every commit
# (AGENTS.md, docs/TESTING.md). To turn it back on, add "push:" under "on:" again.
on:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  app:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.3
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
