plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

apply plugin: "com.google.gms.google-services"

// مفتاح التوقيع خارج Git، ومن غيره تتبني نسخة بتوقيع التطوير
def keyProperties = new Properties()
def keyPropertiesFile = rootProject.file("key.properties")
if (keyPropertiesFile.exists()) {
    keyPropertiesFile.withInputStream { keyProperties.load(it) }
}

android {
    namespace = "com.mylawyer.my_lawyer"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        // One app for clients and lawyers, the production one only (owner decision 2026-11-06)
        applicationId = "com.mylawyer.my_lawyer"
        // 24: Google Play's automatic app protection needs Android 7 or newer
        minSdk = 24
        // Google Play asks for 36 (Android 16) on new uploads
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        if (keyPropertiesFile.exists()) {
            release {
                storeFile = rootProject.file(keyProperties["storeFile"])
                storePassword = keyProperties["storePassword"]
                keyAlias = keyProperties["keyAlias"]
                keyPassword = keyProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        debug {
            signingConfig = signingConfigs.debug
            // خادم التطوير المحلي يعمل بدون تشفير
            manifestPlaceholders += [usesCleartext: "true"]
        }
        release {
            signingConfig = keyPropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
            manifestPlaceholders += [usesCleartext: "false"]
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.3"
}
