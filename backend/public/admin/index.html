<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة تحكم My Lawyer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23469600' d='M12 2 4 5v6c0 5 3.4 9.7 8 11 4.6-1.3 8-6 8-11V5z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/api/v1/admin-panel/styles?v=__VERSION__">
</head>
<body>
<section id="login" class="login-page-wrapper">
  <div class="login-card-box">
    <div style="text-align: center; margin-bottom: 2rem">
      <img class="login-logo" src="/api/v1/admin-panel/logo?v=__VERSION__" alt="My Lawyer">
    </div>
    <div class="login-error" id="login-error"></div>
    <form class="login-form" id="login-form">
      <div>
        <label class="login-label" for="identifier">البريد أو رقم الهاتف <span>*</span></label>
        <div class="login-field">
          <input id="identifier" autocomplete="username" required>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16v12H4zM4 7l8 6 8-6"/></svg>
        </div>
      </div>
      <div>
        <label class="login-label" for="password">كلمة المرور <span>*</span></label>
        <div class="login-field">
          <input id="password" type="password" autocomplete="current-password" required>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 11h12v10H6zM8 11V7a4 4 0 0 1 8 0v4"/></svg>
        </div>
      </div>
      <button class="login-submit" id="login-button" type="submit">تسجيل الدخول</button>
    </form>
  </div>
</section>

<div id="app" class="app-layout" hidden>
  <div class="panel-watermark" id="watermark" aria-hidden="true"></div>
  <div class="sidebar-backdrop" id="backdrop" hidden></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header sidebar-logo-box"><img class="sidebar-logo" src="/api/v1/admin-panel/logo?v=__VERSION__" alt="My Lawyer"><button class="sidebar-toggle" id="sidebar-toggle" type="button" title="فتح القائمة أو إغلاقها" aria-label="فتح القائمة أو إغلاقها"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path id="sidebar-arrow" d="M9 6l6 6-6 6"/></svg></button></div>
    <nav class="sidebar-nav" id="nav"></nav>
    <div class="sidebar-footer" id="nav-footer"></div>
  </aside>
  <main class="main-wrapper">
    <header class="top-header">
      <div class="header-left">
        <button class="mobile-menu-btn" id="menu-button" type="button" title="القائمة"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
        <button class="top-back-btn" id="back-button" type="button" title="رجوع" aria-label="رجوع" hidden><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
        <div class="page-title-box">
          <h2 class="current-page-title" id="page-title"></h2>
          <span class="current-page-subtitle" id="page-subtitle"></span>
        </div>
      </div>
      <div class="header-actions"><div class="global-search" id="global-search"></div><div class="header-toast-wrapper" id="toasts" aria-live="polite" role="status"></div><div class="header-account" id="header-account"></div></div>
    </header>
    <section class="content-container" id="content"></section>
  </main>
</div>
<div id="dialog" hidden></div>

<script src="/api/v1/admin-panel/script?v=__VERSION__"></script>
</body>
</html>
